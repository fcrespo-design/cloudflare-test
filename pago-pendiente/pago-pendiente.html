<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tu pago está pendiente — Método 101</title>
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0D0D0D;
      color: #F3EEE4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    #contenido { max-width: 440px; }
    h1 { font-family: 'Archivo Black', sans-serif; font-size: 22px; margin-bottom: 12px; }
    p { font-size: 14px; opacity: 0.85; line-height: 1.6; }
    a.accion {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      padding: 12px 20px;
      border: 1px solid #3A3A3A;
      color: #F3EEE4;
      text-decoration: none;
      font-size: 14px;
      border-radius: 6px;
    }
    a.volver {
      display: block;
      margin-top: 16px;
      color: #F3EEE4;
      opacity: 0.6;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="contenido">
    <h1>Tu pago está pendiente de confirmación</h1>
    <p>Algunos métodos (como transferencia) demoran en confirmarse. Apenas se apruebe, te llega el acceso. Si quieres avisarnos que ya pagaste, escríbenos.</p>
    <a class="accion" id="link-whatsapp" href="#">Escríbenos por WhatsApp →</a>
    <a class="volver" href="https://felipecrespo.cl">← Volver al inicio</a>
  </div>

  <script>
    const WHATSAPP_NUMERO = '56900000000'; // reemplazar por el número real
    const mensaje = encodeURIComponent('Hola, mi pago de Método 101 quedó pendiente y quiero confirmarles que ya pagué.');
    document.getElementById('link-whatsapp').href = 'https://wa.me/' + WHATSAPP_NUMERO + '?text=' + mensaje;
  </script>
</body>
</html>
