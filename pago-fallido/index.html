<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>No pudimos procesar tu pago — Método 101</title>
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0D0D0D;
      color: #F3EEE4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    #contenido { max-width: 440px; }
    h1 { font-family: 'Archivo Black', sans-serif; font-size: 22px; margin-bottom: 12px; }
    p { font-size: 14px; opacity: 0.85; line-height: 1.6; }
    a.accion {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #E6332B;
      color: #F3EEE4;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
    }
    a.volver {
      display: block;
      margin-top: 16px;
      color: #F3EEE4;
      opacity: 0.6;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="contenido">
    <h1>Tu pago no se pudo completar</h1>
    <p>Puede haber sido un rechazo del banco o algo del checkout. No se te cobró nada. Puedes intentarlo de nuevo, o escribirnos si el problema persiste.</p>
    <a class="accion" href="https://felipecrespo.cl/metodo101.html">Intentar de nuevo</a>
    <a class="volver" href="https://felipecrespo.cl">← Volver al inicio</a>
  </div>
